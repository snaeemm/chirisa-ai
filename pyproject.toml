[project]
name = "shaz"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.15.1",
    "google-genai>=0.3.0",
    "google-generativeai>=0.8.5",
    "googlemaps>=4.10.0",
    "json-repair==0.52.4",
    "pillow>=10.0.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.11.9",
    "pydeck>=0.9.1",
    "pypdf2>=3.0.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.1.1",
    "reportlab>=4.4.4",
    "requests>=2.31.0",
    "streamlit>=1.50.0",
    "unidecode>=1.3.8",
    "xhtml2pdf>=0.2.16",
]

[tool.pyright]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
pythonVersion = "3.13"
pythonPlatform = "Darwin"
