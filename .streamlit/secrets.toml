# Streamlit Secrets Configuration Template
# For local development - copy this file and add your actual API keys
# For Streamlit Community Cloud - configure these in the web interface

# Google Maps API Key for location resolution
GOOGLE_MAPS_API_KEY = "your_google_maps_api_key_here"

# Gemini AI API Key for LLM analysis
GEMINI_API_KEY = "your_gemini_api_key_here"

# Gemini Model Configuration (optional, defaults to gemini-2.5-flash)
GEMINI_MODEL = "gemini-2.5-flash"

# Instructions:
# 1. Replace the placeholder values above with your actual API keys
# 2. Keep this file secure and never commit it to version control
# 3. For Streamlit Cloud deployment, add these same keys in the app's secret management interface